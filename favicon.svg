<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Ludork</title>
  <defs>
    <linearGradient id="tile-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3242"/>
      <stop offset="0.52" stop-color="#1a1f29"/>
      <stop offset="1" stop-color="#11141c"/>
    </linearGradient>
    <radialGradient id="top-sheen" cx="50%" cy="18%" r="65%">
      <stop offset="0" stop-color="#758fbd" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4d6185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="40%" r="42%">
      <stop offset="0" stop-color="#ff7a38" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#eb472e" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#d93329" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon-diag" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9ca6b5"/>
      <stop offset="0.45" stop-color="#dce2ec"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="silver-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6cfdc"/>
      <stop offset="1" stop-color="#8b96a8"/>
    </linearGradient>
    <linearGradient id="silver-bottom" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cad2df"/>
      <stop offset="1" stop-color="#8d98aa"/>
    </linearGradient>
    <linearGradient id="coral-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8542"/>
      <stop offset="1" stop-color="#f05a28"/>
    </linearGradient>
    <filter id="mark-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile-clip">
      <rect x="20" y="20" width="216" height="216" rx="48"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile-clip)">
    <rect x="20" y="20" width="216" height="216" rx="48" fill="url(#tile-bg)"/>
    <rect x="20" y="20" width="216" height="216" rx="48" fill="url(#top-sheen)"/>
    <rect x="20" y="20" width="216" height="216" rx="48" fill="url(#core-glow)"/>

    <!-- Bespoke interlocking geometric ribbon-prism Ludork Engine emblem -->
    <g filter="url(#mark-shadow)">
      <!-- Left vertical pillar (crisp white front face) -->
      <polygon points="72,66 92,53 92,129 72,142" fill="#ffffff"/>
      <!-- Top-left receding bevel arm -->
      <polygon points="92,53 122,74 106,84 92,74" fill="url(#silver-top)"/>

      <!-- Warm coral-orange core play-triangle (upper-left facet) -->
      <polygon points="100,88 126,101 126,108 100,124" fill="url(#coral-core)"/>
      <!-- Warm coral-orange core play-triangle (lower-right tip facet) -->
      <polygon points="131,103 158,116 126,136 126,115" fill="url(#coral-core)"/>

      <!-- Front diagonal interlocking ribbon sweeping bottom-left to center-top -->
      <polygon points="72,148 126,115 126,136 89,159" fill="url(#ribbon-diag)"/>

      <!-- Upper-center fold peak (left white bevel + inner silver return) -->
      <polygon points="100,88 126,72 126,101" fill="#ffffff"/>
      <polygon points="126,89 156,108 126,98" fill="#9ea8b8"/>

      <!-- Outer upper-right arm pointing to play tip -->
      <polygon points="126,72 194,114 166,114 126,89" fill="#ffffff"/>

      <!-- Outer lower-right return arm -->
      <polygon points="194,114 111,167 125,140 166,114" fill="url(#silver-bottom)"/>

      <!-- Bottom-center bright white highlight facet -->
      <polygon points="95,157 125,140 111,167" fill="#ffffff"/>
    </g>

    <!-- Bold Ludork wordmark -->
    <text x="128" y="210" text-anchor="middle"
          fill="#ffffff"
          font-family="'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
          font-size="42" font-weight="600" letter-spacing="-0.4">Ludork</text>

    <!-- Machined inner border rim -->
    <rect x="21.2" y="21.2" width="213.6" height="213.6" rx="46.8"
          fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2.2"/>
  </g>
</svg>
