name: Export Package Windows

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  windows:
    name: Windows package
    uses: ./.github/workflows/export-editor-windows.yml
    with:
      templates: true
      release: ${{ inputs.release == true }}
