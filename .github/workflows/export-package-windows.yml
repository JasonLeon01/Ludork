name: Export Package Windows

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      server_artifact:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  windows:
    name: Windows package
    uses: ./.github/workflows/export-editor-windows.yml
    with:
      templates: true
      release: ${{ inputs.release == true }}
      server_artifact: ${{ inputs.server_artifact }}
