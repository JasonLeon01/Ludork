name: Build Templates

on:
  workflow_call:
    inputs:
      templates:
        type: boolean
        default: true
      windows:
        type: boolean
        default: true
      macos:
        type: boolean
        default: true
      ffmpeg:
        type: boolean
        default: true

permissions:
  contents: read

env:
  PIP_NO_CACHE_DIR: "1"
  CCACHE_DISABLE: "1"

jobs:
  windows_prepare:
    name: Prepare Windows x64 environment
    if: inputs.windows
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up MSVC command-line environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Set up project Python environment
        shell: cmd
        timeout-minutes: 10
        run: tools\setup_python.bat

      - name: Build ScriptTools
        shell: cmd
        timeout-minutes: 30
        run: tools\build_script_tools.bat

      - name: Prepare editor tools without templates
        if: ${{ !inputs.templates }}
        shell: cmd
        run: |
          call tools\cpp_dependencies\lua.bat Game
          if errorlevel 1 exit /b 1
          call tools\init_gnu_make.bat
          if errorlevel 1 exit /b 1
          cmake -S tools/lua_compiler -B obj/editor-luac -DCMAKE_BUILD_TYPE=Release "-DLUDORK_LUA_SOURCE_DIR=%CD%/Game/Engine/ThirdParty/Lua"
          if errorlevel 1 exit /b 1
          cmake --build obj/editor-luac --config Release --target luac
          if errorlevel 1 exit /b 1
          cmake --install obj/editor-luac --config Release --prefix "%CD%/.tools/Lua"
          if errorlevel 1 exit /b 1

      - name: Initialize C++ dependencies
        if: inputs.templates
        shell: cmd
        timeout-minutes: 20
        run: tools\init_cpp_dependencies.bat Game

      - name: Validate native build inputs
        if: inputs.templates
        shell: cmd
        timeout-minutes: 10
        run: |
          .tools\ScriptTools\ScriptTools.exe impl-boundary-check Game
          if errorlevel 1 exit /b 1

      - name: Archive prepared environment
        if: inputs.templates
        shell: cmd
        run: tar.exe -cf windows-native-environment.tar .tools\ScriptTools .tools\gnu-make .tools\sources .tools\build Game\Engine\ThirdParty\LuaSF Game\Engine\ThirdParty\SFML Game\Engine\ThirdParty\LuaGlue Game\Engine\ThirdParty\Lua Game\Engine\ThirdParty\lua-cjson Game\Engine\ThirdParty\zlib Game\Engine\ThirdParty\ffmpeg Game\ThirdPartySource

      - name: Archive prepared editor tools
        if: ${{ !inputs.templates }}
        shell: cmd
        run: tar.exe -cf windows-native-environment.tar .tools\ScriptTools .tools\Lua .tools\gnu-make .tools\sources .tools\build

      - name: Upload prepared environment
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-environment.tar
          path: windows-native-environment.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

  windows_native:
    name: Windows x64 native / ${{ matrix.component }}
    needs: windows_prepare
    if: inputs.templates
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.ffmpeg && '["templates-plain","templates-ffmpeg"]' || '["templates-plain"]') }}
    env:
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up MSVC command-line environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Download prepared environment
        uses: actions/download-artifact@v8
        with:
          name: windows-native-environment.tar
          path: obj/native-environment

      - name: Restore prepared environment
        shell: cmd
        run: tar.exe -xf obj\native-environment\windows-native-environment.tar -C .

      - name: Build templates without FFmpeg
        if: matrix.component == 'templates-plain'
        shell: cmd
        run: tools\create_templates_plain.bat Release obj\export-editor-inputs\Templates

      - name: Build templates with FFmpeg
        if: matrix.component == 'templates-ffmpeg'
        shell: cmd
        run: tools\create_templates_ffmpeg.bat Release obj\export-editor-inputs\Templates

      - name: Archive templates without FFmpeg
        if: matrix.component == 'templates-plain'
        shell: cmd
        run: tar.exe -cf windows-templates-plain.tar -C obj\export-editor-inputs\Templates Cpp Standalone

      - name: Archive Lua compiler
        if: matrix.component == 'templates-plain'
        shell: cmd
        run: tar.exe -cf windows-luac.tar -C .tools\Lua luac.exe

      - name: Archive templates with FFmpeg
        if: matrix.component == 'templates-ffmpeg'
        shell: cmd
        run: tar.exe -cf windows-templates-ffmpeg.tar -C obj\export-editor-inputs\Templates Cpp-ffmpeg Standalone-ffmpeg

      - name: Upload native component
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.component }}.tar
          path: windows-${{ matrix.component }}.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload Lua compiler
        if: matrix.component == 'templates-plain'
        uses: actions/upload-artifact@v7
        with:
          name: windows-luac.tar
          path: windows-luac.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

  macos_prepare:
    name: Prepare macOS ARM64 environment
    if: inputs.macos
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up project Python environment
        env:
          PYTHON: python3
        timeout-minutes: 10
        run: sh tools/setup_python.sh

      - name: Build ScriptTools
        timeout-minutes: 30
        run: sh tools/build_script_tools.sh

      - name: Prepare editor tools without templates
        if: ${{ !inputs.templates }}
        run: |
          sh tools/cpp_dependencies/lua.sh Game
          cmake -S tools/lua_compiler -B obj/editor-luac -DCMAKE_BUILD_TYPE=Release \
            "-DLUDORK_LUA_SOURCE_DIR=$PWD/Game/Engine/ThirdParty/Lua" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
          cmake --build obj/editor-luac --config Release --target luac
          cmake --install obj/editor-luac --config Release --prefix "$PWD/.tools/Lua"

      - name: Initialize C++ dependencies
        if: inputs.templates
        timeout-minutes: 20
        run: sh tools/init_cpp_dependencies.sh Game

      - name: Validate native build inputs
        if: inputs.templates
        timeout-minutes: 10
        run: |
          .tools/ScriptTools/ScriptTools impl-boundary-check Game

      - name: Archive prepared environment
        if: inputs.templates
        run: tar -cf macos-native-environment.tar .tools/ScriptTools Game/Engine/ThirdParty/LuaSF Game/Engine/ThirdParty/SFML Game/Engine/ThirdParty/LuaGlue Game/Engine/ThirdParty/Lua Game/Engine/ThirdParty/lua-cjson Game/Engine/ThirdParty/zlib Game/Engine/ThirdParty/ffmpeg Game/ThirdPartySource

      - name: Archive prepared editor tools
        if: ${{ !inputs.templates }}
        run: tar -cf macos-native-environment.tar .tools/ScriptTools .tools/Lua

      - name: Upload prepared environment
        uses: actions/upload-artifact@v7
        with:
          name: macos-native-environment.tar
          path: macos-native-environment.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

  macos_native:
    name: macOS ARM64 native / ${{ matrix.component }}
    needs: macos_prepare
    if: inputs.templates
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.ffmpeg && '["templates-plain","templates-ffmpeg"]' || '["templates-plain"]') }}
    env:
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download prepared environment
        uses: actions/download-artifact@v8
        with:
          name: macos-native-environment.tar
          path: obj/native-environment

      - name: Restore prepared environment
        run: tar -xf obj/native-environment/macos-native-environment.tar -C .

      - name: Build templates without FFmpeg
        if: matrix.component == 'templates-plain'
        run: |
          mkdir -p obj/export-editor-inputs
          sh tools/create_templates_plain.sh Release obj/export-editor-inputs/Templates

      - name: Build templates with FFmpeg
        if: matrix.component == 'templates-ffmpeg'
        run: |
          mkdir -p obj/export-editor-inputs
          sh tools/create_templates_ffmpeg.sh Release obj/export-editor-inputs/Templates

      - name: Archive templates without FFmpeg
        if: matrix.component == 'templates-plain'
        run: tar -cf macos-templates-plain.tar -C obj/export-editor-inputs/Templates Cpp Standalone

      - name: Archive Lua compiler
        if: matrix.component == 'templates-plain'
        run: tar -cf macos-luac.tar -C .tools/Lua luac

      - name: Archive templates with FFmpeg
        if: matrix.component == 'templates-ffmpeg'
        run: tar -cf macos-templates-ffmpeg.tar -C obj/export-editor-inputs/Templates Cpp-ffmpeg Standalone-ffmpeg

      - name: Upload native component
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.component }}.tar
          path: macos-${{ matrix.component }}.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload Lua compiler
        if: matrix.component == 'templates-plain'
        uses: actions/upload-artifact@v7
        with:
          name: macos-luac.tar
          path: macos-luac.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

