name: Export Server

on:
  workflow_call:
    inputs:
      source_commit:
        type: string
        default: ''
    outputs:
      artifact_name:
        value: ${{ jobs.server.outputs.artifact_name }}
      server_sha:
        value: ${{ jobs.server.outputs.server_sha }}

permissions:
  contents: read

jobs:
  server:
    name: Build Server package
    runs-on: ubuntu-latest
    outputs:
      artifact_name: LudorkServer-${{ steps.revision.outputs.server_sha }}.tar.gz
      server_sha: ${{ steps.revision.outputs.server_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve the source revision
        id: revision
        uses: actions/github-script@v8
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        with:
          script: |
            const revision = process.env.SOURCE_COMMIT;
            if (revision) {
              if (!/^[0-9a-f]{40}$/.test(revision)) throw new Error('A full Server commit SHA is required.');
              core.setOutput('server_sha', revision);
            } else {
              const { resolveServerCommit } = require('./.github/scripts/package_control.cjs');
              await resolveServerCommit({ github, context, core });
            }
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.revision.outputs.server_sha }}
          path: obj/server-source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and verify the Server archive
        env:
          SERVER_SHA: ${{ steps.revision.outputs.server_sha }}
        run: python3 tools/pack_server.py build --source obj/server-source --output "obj/server-artifact/LudorkServer-$SERVER_SHA.tar.gz" --revision "$SERVER_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: LudorkServer-${{ steps.revision.outputs.server_sha }}.tar.gz
          path: obj/server-artifact/LudorkServer-${{ steps.revision.outputs.server_sha }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 7
