name: Export Package macOS

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      server_artifact:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  macos:
    name: macOS package
    uses: ./.github/workflows/export-editor-macos.yml
    with:
      templates: true
      release: ${{ inputs.release == true }}
      server_artifact: ${{ inputs.server_artifact }}
    secrets: inherit
