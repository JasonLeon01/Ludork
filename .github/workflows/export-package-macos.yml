name: Export Package macOS

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      server_source_prepared:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  server_source:
    name: Server source
    if: inputs.server_source_prepared != true
    uses: ./.github/workflows/export-server-source.yml
  macos:
    name: macOS package
    uses: ./.github/workflows/export-editor-macos.yml
    with:
      templates: true
      release: ${{ inputs.release == true }}
    secrets: inherit
