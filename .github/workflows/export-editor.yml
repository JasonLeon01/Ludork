name: Export Editor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_inputs:
    name: Fingerprint build inputs
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.keys.outputs.environment }}
      native: ${{ steps.keys.outputs.native }}
      managed: ${{ steps.keys.outputs.managed }}
      launcher: ${{ steps.keys.outputs.launcher }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fingerprint tracked sources and build configuration
        id: keys
        run: python3 .github/scripts/export_editor_cache.py

  windows_prepare:
    name: Prepare Windows x64 environment
    needs: build_inputs
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore prepared environment cache
        id: environment-cache
        uses: actions/cache/restore@v5
        with:
          path: windows-native-environment.tar
          key: export-v1-windows-2022-${{ runner.arch }}-environment-${{ needs.build_inputs.outputs.environment }}

      - name: Unpack cached environment
        if: steps.environment-cache.outputs.cache-hit == 'true'
        shell: cmd
        run: tar.exe -xf windows-native-environment.tar -C .

      - name: Set up Python
        if: steps.environment-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up MSVC command-line environment
        if: steps.environment-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Restore FFmpeg source archive
        if: steps.environment-cache.outputs.cache-hit != 'true'
        id: ffmpeg-source-cache
        uses: actions/cache/restore@v5
        with:
          path: Game/ThirdPartySource/ffmpeg-*.tar.gz
          key: ${{ runner.os }}-ffmpeg-source-${{ hashFiles('versions.conf') }}

      - name: Set up project Python environment
        if: steps.environment-cache.outputs.cache-hit != 'true'
        shell: cmd
        timeout-minutes: 10
        run: tools\setup_python.bat

      - name: Build ScriptTools
        if: steps.environment-cache.outputs.cache-hit != 'true'
        shell: cmd
        timeout-minutes: 30
        run: tools\build_script_tools.bat

      - name: Initialize C++ dependencies
        if: steps.environment-cache.outputs.cache-hit != 'true'
        shell: cmd
        timeout-minutes: 20
        run: tools\init_cpp_dependencies.bat Game

      - name: Save FFmpeg source archive
        if: steps.environment-cache.outputs.cache-hit != 'true' && steps.ffmpeg-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Game/ThirdPartySource/ffmpeg-*.tar.gz
          key: ${{ steps.ffmpeg-source-cache.outputs.cache-primary-key }}

      - name: Validate native build inputs
        shell: cmd
        timeout-minutes: 10
        run: |
          .tools\ScriptTools\ScriptTools.exe impl-boundary-check Game
          if errorlevel 1 exit /b 1

      - name: Archive prepared environment
        if: steps.environment-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: tar.exe -cf windows-native-environment.tar .tools\ScriptTools .tools\gnu-make .tools\sources .tools\build Game\Engine\ThirdParty\LuaSF Game\Engine\ThirdParty\lua-cjson Game\Engine\ThirdParty\zlib Game\Engine\ThirdParty\ffmpeg Game\ThirdPartySource

      - name: Save prepared environment cache
        if: steps.environment-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: windows-native-environment.tar
          key: ${{ steps.environment-cache.outputs.cache-primary-key }}

      - name: Upload prepared environment
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-environment.tar
          path: windows-native-environment.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

  windows_native:
    name: Windows x64 native / ${{ matrix.component }}
    needs: [build_inputs, windows_prepare]
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      matrix:
        component:
          - templates-plain
          - templates-ffmpeg
    env:
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore native binaries
        id: native-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            obj/template-native-cache
            .tools/Lua
          key: export-v1-windows-2022-${{ runner.arch }}-native-${{ matrix.component }}-Release-${{ needs.build_inputs.outputs.native }}

      - name: Set up MSVC command-line environment
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Download prepared environment
        uses: actions/download-artifact@v8
        with:
          name: windows-native-environment.tar
          path: obj/native-environment

      - name: Restore prepared environment
        shell: cmd
        run: tar.exe -xf obj\native-environment\windows-native-environment.tar -C .

      - name: Build templates without FFmpeg
        if: matrix.component == 'templates-plain'
        shell: cmd
        run: tools\create_templates_plain.bat --native-cache "%CD%\obj\template-native-cache" Release obj\export-editor-inputs\Templates

      - name: Build templates with FFmpeg
        if: matrix.component == 'templates-ffmpeg'
        shell: cmd
        run: tools\create_templates_ffmpeg.bat --native-cache "%CD%\obj\template-native-cache" Release obj\export-editor-inputs\Templates

      - name: Archive templates without FFmpeg
        if: matrix.component == 'templates-plain'
        shell: cmd
        run: tar.exe -cf windows-templates-plain.tar -C obj\export-editor-inputs\Templates Cpp Standalone

      - name: Archive Lua compiler
        if: matrix.component == 'templates-plain'
        shell: cmd
        run: tar.exe -cf windows-luac.tar -C .tools\Lua luac.exe

      - name: Archive templates with FFmpeg
        if: matrix.component == 'templates-ffmpeg'
        shell: cmd
        run: tar.exe -cf windows-templates-ffmpeg.tar -C obj\export-editor-inputs\Templates Cpp-ffmpeg Standalone-ffmpeg

      - name: Save native binaries
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            obj/template-native-cache
            .tools/Lua
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Upload native component
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.component }}.tar
          path: windows-${{ matrix.component }}.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload Lua compiler
        if: matrix.component == 'templates-plain'
        uses: actions/upload-artifact@v7
        with:
          name: windows-luac.tar
          path: windows-luac.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows x64
    needs: [build_inputs, windows_native]
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Resolve active .NET SDK
        id: dotnet-sdk
        shell: pwsh
        run: |
          $version = & dotnet --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore C# build outputs
        id: managed-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            bin/Release
            obj/Release
            Editor/Ludork.Plugin.Abstractions/bin/Release
            Editor/Ludork.Plugin.Abstractions/obj/Release
            Editor/Ludork.Plugin.Avalonia/bin/Release
            Editor/Ludork.Plugin.Avalonia/obj/Release
          key: export-v1-windows-2022-${{ runner.arch }}-managed-Release-${{ steps.dotnet-sdk.outputs.version }}-${{ needs.build_inputs.outputs.managed }}

      - name: Set up MSVC command-line environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Restore editor launcher
        id: launcher-cache
        uses: actions/cache/restore@v5
        with:
          path: obj/editor-launcher/bin/Release
          key: export-v1-windows-2022-${{ runner.arch }}-launcher-Release-${{ needs.build_inputs.outputs.launcher }}

      - name: Build editor launcher
        if: steps.launcher-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = (& dotnet msbuild Ludork.csproj -nologo -getProperty:Version).Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S tools/editor_launcher -B obj/editor-launcher -DCMAKE_BUILD_TYPE=Release "-DLUDORK_VERSION=$version"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build obj/editor-launcher --config Release --target LudorkEditorLauncher
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Save editor launcher
        if: steps.launcher-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: obj/editor-launcher/bin/Release
          key: ${{ steps.launcher-cache.outputs.cache-primary-key }}

      - name: Download prepared environment
        uses: actions/download-artifact@v8
        with:
          name: windows-native-environment.tar
          path: obj/editor-inputs/artifacts

      - name: Download templates without FFmpeg
        uses: actions/download-artifact@v8
        with:
          name: windows-templates-plain.tar
          path: obj/editor-inputs/artifacts

      - name: Download templates with FFmpeg
        uses: actions/download-artifact@v8
        with:
          name: windows-templates-ffmpeg.tar
          path: obj/editor-inputs/artifacts

      - name: Download Lua compiler
        uses: actions/download-artifact@v8
        with:
          name: windows-luac.tar
          path: obj/editor-inputs/artifacts

      - name: Restore editor inputs
        shell: cmd
        run: |
          tar.exe -xf "obj\editor-inputs\artifacts\windows-native-environment.tar" -C .
          if errorlevel 1 exit /b 1
          if not exist ".tools\Lua" mkdir ".tools\Lua"
          if not exist "obj\editor-inputs\Templates" mkdir "obj\editor-inputs\Templates"
          tar.exe -xf "obj\editor-inputs\artifacts\windows-luac.tar" -C ".tools\Lua"
          if errorlevel 1 exit /b 1
          tar.exe -xf "obj\editor-inputs\artifacts\windows-templates-plain.tar" -C "obj\editor-inputs\Templates"
          if errorlevel 1 exit /b 1
          tar.exe -xf "obj\editor-inputs\artifacts\windows-templates-ffmpeg.tar" -C "obj\editor-inputs\Templates"
          if errorlevel 1 exit /b 1

      - name: Package editor
        env:
          EDITOR_BUILD_OPTION: ${{ steps.managed-cache.outputs.cache-hit == 'true' && '--use-current-editor-build' || '' }}
        shell: cmd
        run: tools\pack_editor.bat --templates "%CD%\obj\editor-inputs\Templates" --launcher "%CD%\obj\editor-launcher\bin\Release\Ludork.exe" %EDITOR_BUILD_OPTION%

      - name: Save C# build outputs
        if: steps.managed-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            bin/Release
            obj/Release
            Editor/Ludork.Plugin.Abstractions/bin/Release
            Editor/Ludork.Plugin.Abstractions/obj/Release
            Editor/Ludork.Plugin.Avalonia/bin/Release
            Editor/Ludork.Plugin.Avalonia/obj/Release
          key: ${{ steps.managed-cache.outputs.cache-primary-key }}

      - name: Upload editor package
        uses: actions/upload-artifact@v7
        with:
          name: Ludork-windows-x64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  macos_prepare:
    name: Prepare macOS ARM64 environment
    needs: build_inputs
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore prepared environment cache
        id: environment-cache
        uses: actions/cache/restore@v5
        with:
          path: macos-native-environment.tar
          key: export-v1-macos-15-${{ runner.arch }}-environment-${{ needs.build_inputs.outputs.environment }}

      - name: Unpack cached environment
        if: steps.environment-cache.outputs.cache-hit == 'true'
        run: tar -xf macos-native-environment.tar -C .

      - name: Set up Python
        if: steps.environment-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore FFmpeg source archive
        if: steps.environment-cache.outputs.cache-hit != 'true'
        id: ffmpeg-source-cache
        uses: actions/cache/restore@v5
        with:
          path: Game/ThirdPartySource/ffmpeg-*.tar.gz
          key: ${{ runner.os }}-ffmpeg-source-${{ hashFiles('versions.conf') }}

      - name: Set up project Python environment
        if: steps.environment-cache.outputs.cache-hit != 'true'
        env:
          PYTHON: python3
        timeout-minutes: 10
        run: sh tools/setup_python.sh

      - name: Build ScriptTools
        if: steps.environment-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: sh tools/build_script_tools.sh

      - name: Initialize C++ dependencies
        if: steps.environment-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: sh tools/init_cpp_dependencies.sh Game

      - name: Save FFmpeg source archive
        if: steps.environment-cache.outputs.cache-hit != 'true' && steps.ffmpeg-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Game/ThirdPartySource/ffmpeg-*.tar.gz
          key: ${{ steps.ffmpeg-source-cache.outputs.cache-primary-key }}

      - name: Validate native build inputs
        timeout-minutes: 10
        run: |
          .tools/ScriptTools/ScriptTools impl-boundary-check Game

      - name: Archive prepared environment
        if: steps.environment-cache.outputs.cache-hit != 'true'
        run: tar -cf macos-native-environment.tar .tools/ScriptTools Game/Engine/ThirdParty/LuaSF Game/Engine/ThirdParty/lua-cjson Game/Engine/ThirdParty/zlib Game/Engine/ThirdParty/ffmpeg Game/ThirdPartySource

      - name: Save prepared environment cache
        if: steps.environment-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: macos-native-environment.tar
          key: ${{ steps.environment-cache.outputs.cache-primary-key }}

      - name: Upload prepared environment
        uses: actions/upload-artifact@v7
        with:
          name: macos-native-environment.tar
          path: macos-native-environment.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

  macos_native:
    name: macOS ARM64 native / ${{ matrix.component }}
    needs: [build_inputs, macos_prepare]
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      matrix:
        component:
          - templates-plain
          - templates-ffmpeg
    env:
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore native binaries
        id: native-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            obj/template-native-cache
            .tools/Lua
          key: export-v1-macos-15-${{ runner.arch }}-native-${{ matrix.component }}-Release-${{ needs.build_inputs.outputs.native }}

      - name: Download prepared environment
        uses: actions/download-artifact@v8
        with:
          name: macos-native-environment.tar
          path: obj/native-environment

      - name: Restore prepared environment
        run: tar -xf obj/native-environment/macos-native-environment.tar -C .

      - name: Build templates without FFmpeg
        if: matrix.component == 'templates-plain'
        run: |
          mkdir -p obj/export-editor-inputs
          sh tools/create_templates_plain.sh --native-cache "$PWD/obj/template-native-cache" Release obj/export-editor-inputs/Templates

      - name: Build templates with FFmpeg
        if: matrix.component == 'templates-ffmpeg'
        run: |
          mkdir -p obj/export-editor-inputs
          sh tools/create_templates_ffmpeg.sh --native-cache "$PWD/obj/template-native-cache" Release obj/export-editor-inputs/Templates

      - name: Archive templates without FFmpeg
        if: matrix.component == 'templates-plain'
        run: tar -cf macos-templates-plain.tar -C obj/export-editor-inputs/Templates Cpp Standalone

      - name: Archive Lua compiler
        if: matrix.component == 'templates-plain'
        run: tar -cf macos-luac.tar -C .tools/Lua luac

      - name: Archive templates with FFmpeg
        if: matrix.component == 'templates-ffmpeg'
        run: tar -cf macos-templates-ffmpeg.tar -C obj/export-editor-inputs/Templates Cpp-ffmpeg Standalone-ffmpeg

      - name: Save native binaries
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            obj/template-native-cache
            .tools/Lua
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Upload native component
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.component }}.tar
          path: macos-${{ matrix.component }}.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload Lua compiler
        if: matrix.component == 'templates-plain'
        uses: actions/upload-artifact@v7
        with:
          name: macos-luac.tar
          path: macos-luac.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS ARM64 unsigned
    needs: [build_inputs, macos_native]
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Resolve active .NET SDK
        id: dotnet-sdk
        run: |
          version=$(dotnet --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore C# build outputs
        id: managed-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            bin/Release
            obj/Release
            Editor/Ludork.Plugin.Abstractions/bin/Release
            Editor/Ludork.Plugin.Abstractions/obj/Release
            Editor/Ludork.Plugin.Avalonia/bin/Release
            Editor/Ludork.Plugin.Avalonia/obj/Release
          key: export-v1-macos-15-${{ runner.arch }}-managed-Release-${{ steps.dotnet-sdk.outputs.version }}-${{ needs.build_inputs.outputs.managed }}

      - name: Download prepared environment
        uses: actions/download-artifact@v8
        with:
          name: macos-native-environment.tar
          path: obj/editor-inputs/artifacts

      - name: Download templates without FFmpeg
        uses: actions/download-artifact@v8
        with:
          name: macos-templates-plain.tar
          path: obj/editor-inputs/artifacts

      - name: Download templates with FFmpeg
        uses: actions/download-artifact@v8
        with:
          name: macos-templates-ffmpeg.tar
          path: obj/editor-inputs/artifacts

      - name: Download Lua compiler
        uses: actions/download-artifact@v8
        with:
          name: macos-luac.tar
          path: obj/editor-inputs/artifacts

      - name: Restore editor inputs
        run: |
          tar -xf obj/editor-inputs/artifacts/macos-native-environment.tar -C .
          mkdir -p .tools/Lua obj/editor-inputs/Templates
          tar -xf obj/editor-inputs/artifacts/macos-luac.tar -C .tools/Lua
          tar -xf obj/editor-inputs/artifacts/macos-templates-plain.tar -C obj/editor-inputs/Templates
          tar -xf obj/editor-inputs/artifacts/macos-templates-ffmpeg.tar -C obj/editor-inputs/Templates

      - name: Package unsigned editor DMG
        env:
          EDITOR_BUILD_OPTION: ${{ steps.managed-cache.outputs.cache-hit == 'true' && '--use-current-editor-build' || '' }}
        run: sh tools/pack_editor.sh --templates "$PWD/obj/editor-inputs/Templates" ${EDITOR_BUILD_OPTION:+"$EDITOR_BUILD_OPTION"}

      - name: Save C# build outputs
        if: steps.managed-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            bin/Release
            obj/Release
            Editor/Ludork.Plugin.Abstractions/bin/Release
            Editor/Ludork.Plugin.Abstractions/obj/Release
            Editor/Ludork.Plugin.Avalonia/bin/Release
            Editor/Ludork.Plugin.Avalonia/obj/Release
          key: ${{ steps.managed-cache.outputs.cache-primary-key }}

      - name: Upload unsigned editor DMG
        uses: actions/upload-artifact@v7
        with:
          name: Ludork-macos-arm64-unsigned-${{ github.sha }}
          path: dist/Ludork-*-macos-arm64.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
