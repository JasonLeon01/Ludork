name: Export Editor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CLCACHE_DIR: ${{ github.workspace }}\.cache\clcache
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      LUDORK_FFMPEG_CC_LAUNCHER: sccache
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read runner image version
        id: runner-image
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw "ImageVersion is not available on this runner."
          }
          "version=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Set up MSVC command-line environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Set up native compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.17.0"

      - name: Restore FFmpeg source archive
        id: ffmpeg-source-cache
        uses: actions/cache/restore@v5
        with:
          path: Sample/ThirdPartySource/ffmpeg-*.tar.gz
          key: ${{ runner.os }}-ffmpeg-source-${{ hashFiles('versions.conf') }}

      - name: Set up project Python environment
        shell: cmd
        timeout-minutes: 10
        run: tools\setup_python.bat

      - name: Cache ScriptTools
        id: script-tools-cache
        uses: actions/cache@v5
        with:
          path: .tools/ScriptTools
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-script-tools-v1-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'ScriptTools/**/*.py', 'tools/build_script_tools.bat', 'tools/script_tools_hash.ps1') }}

      - name: Cache ScriptTools compiler outputs
        if: steps.script-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: .cache/clcache
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-script-tools-clcache-v1-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'ScriptTools/**/*.py', 'tools/build_script_tools.bat') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-script-tools-clcache-v1-${{ steps.python.outputs.python-version }}-

      - name: Build ScriptTools
        if: steps.script-tools-cache.outputs.cache-hit != 'true'
        shell: cmd
        timeout-minutes: 30
        run: tools\build_script_tools.bat

      - name: Initialize C++ dependencies
        shell: cmd
        timeout-minutes: 20
        run: tools\init_cpp_dependencies.bat Sample

      - name: Save FFmpeg source archive
        if: steps.ffmpeg-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Sample/ThirdPartySource/ffmpeg-*.tar.gz
          key: ${{ steps.ffmpeg-source-cache.outputs.cache-primary-key }}

      - name: Cache Windows editor templates
        id: editor-templates-cache
        uses: actions/cache@v5
        with:
          path: .tools/EditorTemplates/windows-x64
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-editor-templates-v1-${{ hashFiles('versions.conf', 'requirements.txt', 'ScriptTools/**/*.py', 'Sample/**', 'Sample/.emmyrc.json', 'Sample/.gitignore', 'patches/**', 'tools/build_cpp.bat', 'tools/build_script_tools.bat', 'tools/build_standalone.bat', 'tools/create_templates.bat', '.tools/ScriptTools/source.sha256', '.tools/ScriptTools/runtime-versions.txt') }}

      - name: Build Windows editor templates
        if: steps.editor-templates-cache.outputs.cache-hit != 'true'
        shell: cmd
        timeout-minutes: 90
        env:
          LUDORK_FFMPEG_BUILD_JOBS: 4
        run: tools\create_templates.bat Release .tools\EditorTemplates\windows-x64

      - name: Cache Windows UI preview host
        id: ui-preview-host-cache
        uses: actions/cache@v5
        with:
          path: .tools/UiPreviewHost/bin/Release
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-ui-preview-host-v1-${{ hashFiles('versions.conf', 'requirements.txt', 'ScriptTools/**/*.py', 'patches/**', 'UiPreviewHost/**', 'Sample/CMakeLists.txt', 'Sample/cmake/**', 'Sample/Core/**', 'Sample/LuaSF/**', 'Sample/Standard/**', 'Sample/lua-cjson/**', 'Sample/zlib/**', 'tools/build_script_tools.bat', 'tools/build_ui_preview_host.bat', '.tools/ScriptTools/source.sha256', '.tools/ScriptTools/runtime-versions.txt') }}

      - name: Build UI preview host
        if: steps.ui-preview-host-cache.outputs.cache-hit != 'true'
        shell: cmd
        timeout-minutes: 60
        run: tools\build_ui_preview_host.bat Release

      - name: Validate native build inputs
        shell: cmd
        timeout-minutes: 10
        run: |
          .tools\ScriptTools\ScriptTools.exe impl-boundary-check Sample
          if errorlevel 1 exit /b 1
          .tools\ScriptTools\ScriptTools.exe ui-adapter-check "%CD%"
          if errorlevel 1 exit /b 1
          .tools\ScriptTools\ScriptTools.exe ui-assets validate Sample
          if errorlevel 1 exit /b 1

      - name: Package editor
        shell: cmd
        run: tools\pack_editor.bat --templates .tools\EditorTemplates\windows-x64 --use-current-ui-preview-host

      - name: Upload editor package
        uses: actions/upload-artifact@v7
        with:
          name: Ludork-windows-x64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  macos:
    name: macOS ARM64 unsigned
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Restore FFmpeg source archive
        id: ffmpeg-source-cache
        uses: actions/cache/restore@v5
        with:
          path: Sample/ThirdPartySource/ffmpeg-*.tar.gz
          key: ${{ runner.os }}-ffmpeg-source-${{ hashFiles('versions.conf') }}

      - name: Set up project Python environment
        env:
          PYTHON: python3
        timeout-minutes: 10
        run: sh tools/setup_python.sh

      - name: Build ScriptTools
        timeout-minutes: 30
        run: sh tools/build_script_tools.sh

      - name: Initialize C++ dependencies
        timeout-minutes: 20
        run: sh tools/init_cpp_dependencies.sh Sample

      - name: Save FFmpeg source archive
        if: steps.ffmpeg-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Sample/ThirdPartySource/ffmpeg-*.tar.gz
          key: ${{ steps.ffmpeg-source-cache.outputs.cache-primary-key }}

      - name: Validate implementation boundaries
        timeout-minutes: 10
        run: .tools/ScriptTools/ScriptTools impl-boundary-check Sample

      - name: Build UI preview host
        timeout-minutes: 60
        run: sh tools/build_ui_preview_host.sh Release

      - name: Package unsigned editor DMG
        run: sh tools/pack_editor.sh

      - name: Upload unsigned editor DMG
        uses: actions/upload-artifact@v7
        with:
          name: Ludork-macos-arm64-unsigned-${{ github.sha }}
          path: dist/Ludork-*-macos-arm64.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
