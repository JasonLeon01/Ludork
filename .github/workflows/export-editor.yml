name: Export Editor

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: export-editor-temporary
  cancel-in-progress: false

jobs:
  package_decision:
    name: Decide whether to package
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare with the last successful temporary editor
        id: decision
        uses: actions/github-script@v8
        with:
          script: |
            const { shouldRun } = require('./.github/scripts/package_control.cjs');
            await shouldRun({ github, context, core }, 'export-editor.yml', 'Record successful editor');

  windows:
    name: Windows x64
    needs: package_decision
    if: needs.package_decision.outputs.should_build == 'true'
    uses: ./.github/workflows/export-editor-windows.yml

  macos:
    name: macOS ARM64
    needs: package_decision
    if: needs.package_decision.outputs.should_build == 'true'
    uses: ./.github/workflows/export-editor-macos.yml
    secrets: inherit

  package_complete:
    name: Record successful editor
    needs: [windows, macos]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Record the packaged commit
        env:
          PACKAGE_SHA: ${{ github.sha }}
        run: echo "Both template-free editors completed for $PACKAGE_SHA" >> "$GITHUB_STEP_SUMMARY"
