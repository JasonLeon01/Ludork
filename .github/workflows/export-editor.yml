name: Export Editor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Set up MSVC command-line environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Restore FFmpeg source archive
        id: ffmpeg-source-cache
        uses: actions/cache/restore@v5
        with:
          path: Sample/ThirdPartySource/ffmpeg-*.tar.gz
          key: ${{ runner.os }}-ffmpeg-source-${{ hashFiles('versions.conf') }}

      - name: Set up project Python environment
        shell: cmd
        timeout-minutes: 10
        run: tools\setup_python.bat

      - name: Build ScriptTools
        shell: cmd
        timeout-minutes: 30
        run: tools\build_script_tools.bat

      - name: Initialize C++ dependencies
        shell: cmd
        timeout-minutes: 20
        run: tools\init_cpp_dependencies.bat Sample

      - name: Save FFmpeg source archive
        if: steps.ffmpeg-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Sample/ThirdPartySource/ffmpeg-*.tar.gz
          key: ${{ steps.ffmpeg-source-cache.outputs.cache-primary-key }}

      - name: Validate native build inputs
        shell: cmd
        timeout-minutes: 10
        run: |
          .tools\ScriptTools\ScriptTools.exe impl-boundary-check Sample
          if errorlevel 1 exit /b 1
          .tools\ScriptTools\ScriptTools.exe ui-adapter-check "%CD%"
          if errorlevel 1 exit /b 1
          .tools\ScriptTools\ScriptTools.exe ui-assets validate Sample
          if errorlevel 1 exit /b 1

      - name: Package editor
        shell: cmd
        run: tools\pack_editor.bat

      - name: Upload editor package
        uses: actions/upload-artifact@v7
        with:
          name: Ludork-windows-x64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  macos:
    name: macOS ARM64 unsigned
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Restore FFmpeg source archive
        id: ffmpeg-source-cache
        uses: actions/cache/restore@v5
        with:
          path: Sample/ThirdPartySource/ffmpeg-*.tar.gz
          key: ${{ runner.os }}-ffmpeg-source-${{ hashFiles('versions.conf') }}

      - name: Set up project Python environment
        env:
          PYTHON: python3
        timeout-minutes: 10
        run: sh tools/setup_python.sh

      - name: Build ScriptTools
        timeout-minutes: 30
        run: sh tools/build_script_tools.sh

      - name: Initialize C++ dependencies
        timeout-minutes: 20
        run: sh tools/init_cpp_dependencies.sh Sample

      - name: Save FFmpeg source archive
        if: steps.ffmpeg-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Sample/ThirdPartySource/ffmpeg-*.tar.gz
          key: ${{ steps.ffmpeg-source-cache.outputs.cache-primary-key }}

      - name: Validate native build inputs
        timeout-minutes: 10
        run: |
          .tools/ScriptTools/ScriptTools impl-boundary-check Sample
          .tools/ScriptTools/ScriptTools ui-adapter-check "$PWD"
          .tools/ScriptTools/ScriptTools ui-assets validate Sample

      - name: Package unsigned editor DMG
        run: sh tools/pack_editor.sh

      - name: Upload unsigned editor DMG
        uses: actions/upload-artifact@v7
        with:
          name: Ludork-macos-arm64-unsigned-${{ github.sha }}
          path: dist/Ludork-*-macos-arm64.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
