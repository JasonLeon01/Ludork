name: Export Editor Windows

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      templates:
        type: boolean
        default: false
      release:
        type: boolean
        default: false
      skip_server:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  EDITOR_CHANNEL: ${{ inputs.release && '--release' || '--dev' }}

concurrency:
  group: export-${{ inputs.templates && 'package' || 'editor' }}-windows-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref || 'temporary' }}
  cancel-in-progress: false

jobs:
  server:
    name: Server package
    if: ${{ !inputs.skip_server }}
    uses: ./.github/workflows/export-server.yml

  preparation:
    uses: ./.github/workflows/build-templates.yml
    with:
      templates: ${{ inputs.templates == true }}
      windows: true
      macos: false

  windows:
    name: Windows x64
    needs: preparation
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CMAKE_GENERATOR: Ninja
      CCACHE_DISABLE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate editor SDK configuration
        run: python tools/build_toolchain.py editor-sdk

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up MSVC command-line environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build editor launcher
        shell: pwsh
        run: |
          $version = (& dotnet msbuild Ludork.csproj -nologo -getProperty:Version).Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S tools/editor_launcher -B obj/editor-launcher -DCMAKE_BUILD_TYPE=Release "-DLUDORK_VERSION=$version"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build obj/editor-launcher --config Release --target LudorkEditorLauncher
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Download prepared environment
        uses: actions/download-artifact@v8
        with:
          name: windows-native-environment.tar
          path: obj/editor-inputs/artifacts

      - name: Download templates without FFmpeg
        if: inputs.templates
        uses: actions/download-artifact@v8
        with:
          name: windows-templates-plain.tar
          path: obj/editor-inputs/artifacts

      - name: Download templates with FFmpeg
        if: inputs.templates
        uses: actions/download-artifact@v8
        with:
          name: windows-templates-ffmpeg.tar
          path: obj/editor-inputs/artifacts

      - name: Download Lua compiler
        if: inputs.templates
        uses: actions/download-artifact@v8
        with:
          name: windows-luac.tar
          path: obj/editor-inputs/artifacts

      - name: Restore editor tools
        if: ${{ !inputs.templates }}
        shell: cmd
        run: tar.exe -xf "obj\editor-inputs\artifacts\windows-native-environment.tar" -C .

      - name: Restore editor inputs
        if: inputs.templates
        shell: cmd
        run: |
          tar.exe -xf "obj\editor-inputs\artifacts\windows-native-environment.tar" -C .
          if errorlevel 1 exit /b 1
          if not exist ".tools\Lua" mkdir ".tools\Lua"
          if not exist "obj\editor-inputs\Templates" mkdir "obj\editor-inputs\Templates"
          tar.exe -xf "obj\editor-inputs\artifacts\windows-luac.tar" -C ".tools\Lua"
          if errorlevel 1 exit /b 1
          tar.exe -xf "obj\editor-inputs\artifacts\windows-templates-plain.tar" -C "obj\editor-inputs\Templates"
          if errorlevel 1 exit /b 1
          tar.exe -xf "obj\editor-inputs\artifacts\windows-templates-ffmpeg.tar" -C "obj\editor-inputs\Templates"
          if errorlevel 1 exit /b 1

      - name: Package editor
        env:
          TEMPLATE_OPTION: ${{ inputs.templates && !inputs.release && '--templates' || '--without-templates' }}
          TEMPLATE_DIRECTORY: ${{ inputs.templates && !inputs.release && 'obj/editor-inputs/Templates' || '' }}
        shell: cmd
        run: tools\pack_editor.bat %TEMPLATE_OPTION% %TEMPLATE_DIRECTORY% --launcher "%CD%\obj\editor-launcher\bin\Release\Ludork.exe" %EDITOR_CHANNEL%

      - name: Build editor MSI
        if: inputs.release && inputs.templates && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: cmd
        run: tools\pack_editor_msi.bat --build-info obj\editor-package-metadata\BuildInfo.json

      - name: Build editor EXE
        if: inputs.release && inputs.templates && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: cmd
        run: tools\pack_editor_exe.bat --build-info obj\editor-package-metadata\BuildInfo.json

      - name: Archive project templates
        if: inputs.templates
        shell: cmd
        run: .tools\ScriptTools\ScriptTools.exe template-archive obj\editor-inputs\Templates obj\export-template-assets --platform windows

      - name: Upload Source template
        if: inputs.templates
        uses: actions/upload-artifact@v7
        with:
          name: game-source.zip
          path: obj/export-template-assets/game-source.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload Source FFmpeg template
        if: inputs.templates
        uses: actions/upload-artifact@v7
        with:
          name: game-source-ffmpeg.zip
          path: obj/export-template-assets/game-source-ffmpeg.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload Standalone template
        if: inputs.templates
        uses: actions/upload-artifact@v7
        with:
          name: game-standalone.zip
          path: obj/export-template-assets/game-standalone.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload Standalone FFmpeg template
        if: inputs.templates
        uses: actions/upload-artifact@v7
        with:
          name: game-standalone-ffmpeg.zip
          path: obj/export-template-assets/game-standalone-ffmpeg.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Archive daily editor package
        if: ${{ !inputs.release }}
        id: archive
        env:
          ARCHIVE_PREFIX: ${{ inputs.templates && 'Ludork' || 'Ludork-editor' }}
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath obj/editor-package-metadata/BuildInfo.json -Raw | ConvertFrom-Json).fullVersion
          $archiveName = "$env:ARCHIVE_PREFIX-$version-windows-x64.7z"
          $archivePath = Join-Path $PWD $archiveName
          Push-Location dist
          try {
            & "$env:ProgramFiles\7-Zip\7z.exe" a -t7z -m0=LZMA2 -mx=5 -mmt=on -mtm=off -mtc=off -mta=off $archivePath .\*
            if ($LASTEXITCODE) { throw "7z archive failed: $LASTEXITCODE" }
            & "$env:ProgramFiles\7-Zip\7z.exe" t $archivePath
            if ($LASTEXITCODE) { throw "7z verification failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          "path=$archiveName" >> $env:GITHUB_OUTPUT

      - name: Upload editor package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.templates && 'Ludork' || 'Ludork-editor' }}-windows-x64-${{ github.sha }}
          path: ${{ inputs.release && 'dist/' || steps.archive.outputs.path }}
          archive: ${{ inputs.release == true }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

      - name: Upload editor MSI
        if: inputs.release && inputs.templates && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.templates && 'Ludork' || 'Ludork-editor' }}-windows-x64-msi-${{ github.sha }}
          path: obj/installer/output/Ludork-*-windows-x64.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload editor EXE
        if: inputs.release && inputs.templates && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: Ludork-windows-x64-exe-${{ github.sha }}
          path: obj/installer/output/Ludork-*-windows-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
